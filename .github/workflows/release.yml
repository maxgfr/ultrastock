name: Release

# Conventional-Commit-driven releases, fully in CI. On every push to `main`,
# semantic-release inspects the commits since the last release and, when they
# warrant one (feat → minor, fix → patch, `!`/BREAKING → major):
#   - runs the full gate (typecheck / lint / test / reproducible bundle / evals),
#   - syncs the version across package.json / src/version.ts / SKILL.md and
#     rebuilds the bundle (scripts/sync-version.mjs),
#   - commits the bump back to `main` as `chore(release): <v> [skip ci]`,
#   - tags `v<version>` and creates the GitHub release with the tarball, the
#     SKILL.md and the bundle attached.
# No npm-registry publish — the built-in GITHUB_TOKEN is enough.
on:
  push:
    branches: [main]
  # Required by engine-repin.yml: a push made with GITHUB_TOKEN does not fire
  # another workflow's `on: push`, so the re-pin job dispatches this one.
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Gate — typecheck / lint / test / reproducible bundle / offline evals
        run: |
          pnpm run typecheck
          pnpm run lint
          pnpm test
          pnpm run check:build
          pnpm run eval

      - name: Release (semantic-release)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
